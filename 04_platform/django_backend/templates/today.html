<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your 10 minutes - 285IQ</title>
    <link rel="stylesheet" href="/static/learning/app_theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #111827 0%, #312e81 100%); min-height: 100vh; padding: 20px; color: #e5e7eb; }
        .wrap { max-width: 640px; margin: 0 auto; }
        .back a { color: #c7d2fe; text-decoration: none; font-weight: 700; }
        h1 { font-size: 26px; color: #fff; margin: 16px 0 6px; }
        .sub { color: #c7d2fe; margin-bottom: 18px; line-height: 1.5; }
        .bar { height: 8px; background: rgba(255,255,255,0.12); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
        .bar > div { height: 100%; width: 0; background: #22d3ee; transition: width .3s; }
        .card { background: rgba(15,23,42,0.7); border: 1px solid rgba(199,210,254,0.25); border-radius: 14px; padding: 22px; }
        .tag { display: inline-block; font-size: 12px; font-weight: 700; color: #0f172a; background: #22d3ee; padding: 3px 10px; border-radius: 99px; margin-bottom: 12px; }
        .tag.mistake { background: #fbbf24; }
        .q { font-size: 19px; line-height: 1.45; color: #fff; margin-bottom: 16px; }
        .opt, .btn { display: block; width: 100%; text-align: left; font: inherit; color: #e5e7eb; background: rgba(255,255,255,0.07); border: 1px solid rgba(199,210,254,0.3); border-radius: 10px; padding: 13px 14px; margin-bottom: 9px; cursor: pointer; }
        .opt:hover:not(:disabled), .btn:hover { border-color: #22d3ee; }
        .opt.good { background: rgba(16,185,129,0.25); border-color: #10b981; }
        .opt.bad { background: rgba(239,68,68,0.25); border-color: #ef4444; }
        .btn.primary { background: #22d3ee; color: #0f172a; font-weight: 700; text-align: center; border: 0; }
        .row { display: flex; gap: 8px; } .row .btn { text-align: center; }
        input.ans { width: 100%; font: inherit; padding: 13px 14px; border-radius: 10px; border: 1px solid rgba(199,210,254,0.3); background: rgba(255,255,255,0.07); color: #fff; margin-bottom: 10px; }
        .fb { margin: 12px 0; padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,0.06); line-height: 1.5; }
        .big { font-size: 40px; font-weight: 800; color: #fff; margin: 6px 0; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="back"><a href="/">&larr; Dashboard</a></div>
    <h1>Your 10 minutes</h1>
    <p class="sub" id="sub">Picking today's session...</p>
    <div class="bar" role="progressbar" aria-label="Session progress"><div id="fill"></div></div>
    <div class="card" id="stage" aria-live="polite"></div>
</div>
<script>
(function () {
    var items = [], i = 0, correct = 0, answered = 0, missedBack = 0, startedAt = 0;
    var stage = document.getElementById('stage');
    function cookie(n) { var m = document.cookie.match('(^|;)\\s*' + n + '=([^;]+)'); return m ? decodeURIComponent(m[2]) : ''; }
    function post(url, body) {
        return fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': cookie('csrftoken') }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
    }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function progress() { document.getElementById('fill').style.width = (items.length ? (i / items.length) * 100 : 0) + '%'; }
    function next() { i++; progress(); show(); }

    function tagFor(it) {
        var t = el('span', 'tag' + (it.source === 'mistake' ? ' mistake' : ''), it.source === 'mistake' ? 'Missed before' : it.kind === 'flashcard' ? 'Flashcard' : it.topic);
        return t;
    }

    function showQuestion(it) {
        var q = it.question, t0 = Date.now(), done = false;
        stage.replaceChildren(tagFor(it), el('p', 'q', q.question_text));
        var fb = el('div', 'fb'); fb.hidden = true;
        var nextBtn = el('button', 'btn primary', i === items.length - 1 ? 'Finish' : 'Next'); nextBtn.hidden = true;
        nextBtn.onclick = next;
        function submit(body, chosenBtn) {
            if (done) return; done = true;
            body.question_id = q.id; body.time_spent_ms = Date.now() - t0;
            post('/api/attempts/', body).then(function (r) {
                answered++;
                if (r.is_correct) correct++; else if (it.source === 'mistake') missedBack++;
                if (chosenBtn) chosenBtn.classList.add(r.is_correct ? 'good' : 'bad');
                fb.hidden = false;
                fb.textContent = (r.is_correct ? 'Correct. ' : 'Not quite. ' + (r.correct_answer ? 'Answer: ' + r.correct_answer + '. ' : '')) + (r.explanation || '');
                nextBtn.hidden = false; nextBtn.focus();
                Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function (b) { b.disabled = true; });
                var ai = stage.querySelector('input.ans'); if (ai) ai.disabled = true;
                var sb = stage.querySelector('.submit'); if (sb) sb.hidden = true;
            }).catch(function () { done = false; fb.hidden = false; fb.textContent = 'Could not save that answer. Check your connection and try again.'; });
        }
        if (q.options && q.options.length) {
            q.options.forEach(function (o) {
                var b = el('button', 'opt', o.option_text); b.type = 'button';
                b.onclick = function () { submit({ selected_option_id: o.id }, b); };
                stage.appendChild(b);
            });
        } else {
            var input = el('input', 'ans'); input.type = 'text'; input.setAttribute('aria-label', 'Your answer'); input.autocomplete = 'off';
            var go = el('button', 'btn primary submit', 'Check'); go.type = 'button';
            go.onclick = function () { if (input.value.trim()) submit({ answer: input.value.trim() }); };
            input.onkeydown = function (e) { if (e.key === 'Enter') go.click(); };
            stage.append(input, go); input.focus();
        }
        stage.append(fb, nextBtn);
    }

    function showCard(it) {
        stage.replaceChildren(tagFor(it), el('p', 'q', it.front));
        var back = el('div', 'fb', it.back); back.hidden = true;
        var reveal = el('button', 'btn primary', 'Show answer'); reveal.type = 'button';
        var rate = el('div', 'row'); rate.hidden = true;
        [['again', 'Again'], ['hard', 'Hard'], ['good', 'Good'], ['easy', 'Easy']].forEach(function (r) {
            var b = el('button', 'btn', r[1]); b.type = 'button';
            b.onclick = function () { post('/api/flashcards/review/', { flashcard_id: it.id, rating: r[0] }).then(next, next); };
            rate.appendChild(b);
        });
        reveal.onclick = function () { back.hidden = false; rate.hidden = false; reveal.hidden = true; };
        stage.append(back, reveal, rate);
    }

    function finish() {
        var mins = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
        document.getElementById('fill').style.width = '100%';
        var title = el('p', 'tag', 'Done for today');
        var big = el('p', 'big', answered ? correct + ' / ' + answered + ' correct' : 'Session complete');
        var msg = el('p', 'sub', 'You finished in about ' + mins + ' min.' + (missedBack ? ' ' + missedBack + ' earlier mistake' + (missedBack > 1 ? 's' : '') + ' still need another go; they will come back.' : ' Nice work. Come back tomorrow for the next one.'));
        var home = el('a', 'btn primary', 'Back to dashboard'); home.href = '/'; home.style.textDecoration = 'none';
        var more = el('a', 'btn', 'Keep going: pick a topic'); more.href = '/subjects/'; more.style.textDecoration = 'none';
        stage.replaceChildren(title, big, msg, home, more);
    }

    function show() {
        if (i >= items.length) return finish();
        var it = items[i];
        if (it.kind === 'flashcard') showCard(it); else showQuestion(it);
    }

    fetch('/api/today/', { credentials: 'include' }).then(function (r) { return r.json(); }).then(function (d) {
        items = d.items || [];
        if (!items.length) {
            document.getElementById('sub').textContent = 'Nothing is due right now.';
            stage.replaceChildren(el('p', 'q', 'You are all caught up. Pick any topic to keep going.'));
            var a = el('a', 'btn primary', 'Choose a topic'); a.href = '/subjects/'; a.style.textDecoration = 'none'; stage.appendChild(a);
            return;
        }
        document.getElementById('sub').textContent = 'About ' + d.minutes + ' min: ' + d.summary + '.';
        startedAt = Date.now(); show();
    }).catch(function () { document.getElementById('sub').textContent = 'Could not load today\'s session. Refresh to try again.'; });
})();
</script>
</body>
</html>
