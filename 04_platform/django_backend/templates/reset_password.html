<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password - 285IQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { font-size: 28px; color: #667eea; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .msg.show { display: block; }
        .msg.error { background: #fee2e2; color: #dc2626; }
        .msg.success { background: #d1fae5; color: #059669; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><h1>285IQ</h1><p>Set your new password</p></div>
        <div id="msg" class="msg"></div>
        <form id="form">
            <input type="hidden" id="uid" name="uid">
            <input type="hidden" id="token" name="token">
            <div class="form-group">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="new_password_confirm">Confirm new password</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" required minlength="8">
            </div>
            <button type="submit" class="submit-btn" id="btn">Reset password</button>
        </form>
        <div class="back-link"><a href="/login/">Back to login</a></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('uid').value = params.get('uid') || '';
        document.getElementById('token').value = params.get('token') || '';

        const form = document.getElementById('form');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('btn');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const uid = document.getElementById('uid').value;
            const token = document.getElementById('token').value;
            if (!uid || !token) {
                msg.textContent = 'Invalid or missing reset link. Request a new one from the login page.';
                msg.className = 'msg show error';
                return;
            }
            const new_password = document.getElementById('new_password').value;
            const new_password_confirm = document.getElementById('new_password_confirm').value;
            if (new_password !== new_password_confirm) {
                msg.textContent = 'Passwords do not match.';
                msg.className = 'msg show error';
                return;
            }
            btn.disabled = true;
            msg.className = 'msg';
            msg.classList.remove('show', 'error', 'success');
            try {
                const r = await fetch('/api/users/auth/password-reset/confirm/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    credentials: 'include',
                    body: JSON.stringify({ uid, token, new_password, new_password_confirm })
                });
                const data = await r.json();
                if (r.ok) {
                    msg.textContent = data.message || 'Password reset. You can now log in.';
                    msg.classList.add('show', 'success');
                    setTimeout(() => { window.location.href = '/login/'; }, 2000);
                } else {
                    msg.textContent = data.error || data.new_password || 'Something went wrong.';
                    msg.classList.add('show', 'error');
                }
            } catch (err) {
                msg.textContent = 'Network error. Try again.';
                msg.classList.add('show', 'error');
            }
            btn.disabled = false;
        });
        function getCookie(n) {
            const c = document.cookie.split(';');
            for (let i = 0; i < c.length; i++) {
                const x = c[i].trim();
                if (x.startsWith(n + '=')) return decodeURIComponent(x.slice(n.length + 1));
            }
            return null;
        }
    </script>
</body>
</html>
