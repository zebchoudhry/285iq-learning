<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 285IQ Learning Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #020817;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: #0f172a;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 32px;
            color: #7dd3fc;
            margin-bottom: 8px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #f1f5f9;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        .error-message {
            background: rgba(239,68,68,0.16);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #6d5dfc);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6,182,212,0.35);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
            font-size: 14px;
        }

        .login-link a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
        .consent { margin: 4px 0 18px; }
        .consent .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; margin-bottom: 10px; font-weight: 400; }
        .consent input[type=checkbox] { width: auto !important; margin-top: 3px; flex: none; }
        .consent-note { color: #94a3b8; font-size: 13px; margin-top: 6px; line-height: 1.4; }
    </style>
    <link rel="stylesheet" href="/static/learning/app_theme.css">
    <style>
        /* shared dark form controls for pages migrated from the old light theme */
        body.iq-app input, body.iq-app select, body.iq-app textarea {
            background: #111827 !important; color: #f1f5f9 !important; border: 1px solid #334155 !important;
        }
        body.iq-app input::placeholder, body.iq-app textarea::placeholder { color: #64748b !important; }
        body.iq-app input:focus, body.iq-app select:focus, body.iq-app textarea:focus {
            outline: none; border-color: #06b6d4 !important; box-shadow: 0 0 0 3px rgba(6,182,212,0.2) !important;
        }
        body.iq-app a { color: #7dd3fc; }
        body.iq-app label { color: #cbd5e1; }
    </style>
</head>
<body class="iq-app">
    <div class="register-container">
        <div class="logo">
            <h1>285IQ</h1>
            <p>Create Your Account</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="parent_email">Parent or carer's email <span style="font-weight:400;opacity:.8">(optional)</span></label>
                <input type="email" id="parent_email" name="parent_email" autocomplete="off" aria-describedby="parentHint">
                <p id="parentHint" class="consent-note">So a parent can see how your revision is going. We email them once to confirm, and send nothing until they do.</p>
            </div>

            <div class="consent">
                <label class="check"><input type="checkbox" id="age_confirmed" name="age_confirmed" required> <span>I am 13 or over.</span></label>
                <label class="check"><input type="checkbox" id="accept_terms" name="accept_terms" required> <span>I agree to the <a href="/terms/" target="_blank" rel="noopener">terms of use</a> and have read the <a href="/privacy/" target="_blank" rel="noopener">privacy notice</a>.</span></label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Register</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login/">Login here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;
            const parent_email = document.getElementById('parent_email').value.trim();
            const accept_terms = document.getElementById('accept_terms').checked;
            const age_confirmed = document.getElementById('age_confirmed').checked;

            if (password !== password_confirm) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';
            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/users/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password, password_confirm, parent_email, accept_terms, age_confirmed })
                });

                const data = await response.json();

                if (response.ok) {
                    // Redirect to dashboard
                    window.location.href = '/';
                } else {
                    // Show error messages
                    let errorText = 'Registration failed. ';
                    if (data.password) {
                        errorText += data.password.join(' ');
                    } else if (data.username) {
                        errorText += data.username.join(' ');
                    } else if (data.email) {
                        errorText += data.email.join(' ');
                    } else if (data.accept_terms) {
                        errorText += [].concat(data.accept_terms).join(' ');
                    } else if (data.age_confirmed) {
                        errorText += [].concat(data.age_confirmed).join(' ');
                    } else if (data.parent_email) {
                        errorText += [].concat(data.parent_email).join(' ');
                    } else {
                        errorText += 'Please check your information and try again.';
                    }
                    errorMessage.textContent = errorText;
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
