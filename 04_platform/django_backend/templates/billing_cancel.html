<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment cancelled - 285IQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#020817;--surface:#0f172a;--border:#334155;--text:#f1f5f9;--text-muted:#64748b;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Exo 2',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:440px;width:100%;text-align:center;}
        .icon{font-size:48px;margin-bottom:20px;}
        h1{font-size:22px;font-weight:800;margin-bottom:12px;}
        p{color:var(--text-muted);font-size:14px;margin-bottom:28px;line-height:1.6;}
        a{display:inline-block;padding:12px 28px;background:#334155;color:var(--text);text-decoration:none;border-radius:10px;font-weight:700;font-size:14px;}
        a:hover{background:#475569;}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✕</div>
        <h1>Payment cancelled</h1>
        <p>No charge was made. You can upgrade anytime from the dashboard.</p>
        <a href="/">Back to dashboard</a>
    </div>
</body>
</html>
