<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - 285IQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 24px; }
        .container { max-width: 640px; margin: 0 auto; background: white; border-radius: 16px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        h1 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
        .subtitle { color: #64748b; margin-bottom: 24px; font-size: 14px; }
        .back { margin-bottom: 16px; }
        .back a { color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 600; }
        .settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid #f1f5f9; }
        .settings-row:last-child { border-bottom: none; }
        .form-group { flex: 1; min-width: 120px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        .subject-name { font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .btn { padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: #e2e8f0; color: #475569; margin-top: 24px; }
        .btn-logout { background: #fee2e2; color: #dc2626; margin-top: 24px; }
        #message { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        #message.success { background: #d1fae5; color: #065f46; display: block; }
        #message.error { background: #fee2e2; color: #dc2626; display: block; }
        .empty { color: #64748b; padding: 24px; text-align: center; }
    </style>
</head>
<body>
    <div class="back"><a href="/">← Dashboard</a></div>
    <div class="container">
        <h1>Settings</h1>
        <p class="subtitle">Manage your exam dates and target grades</p>
        <div id="message"></div>
        <div id="settingsList"><div class="empty">Loading...</div></div>
        <button type="button" class="btn btn-logout" id="logoutBtn">Log out</button>
    </div>
    <script>
        const csrf = document.cookie.match(/csrftoken=([^;]+)/) ? document.cookie.match(/csrftoken=([^;]+)/)[1] : '';
        function showMsg(text, isError) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = isError ? 'error' : 'success';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
        async function loadSettings() {
            try {
                const r = await fetch('/api/users/me/settings/', { credentials: 'include' });
                const data = await r.json();
                const list = document.getElementById('settingsList');
                if (!data.settings || data.settings.length === 0) {
                    list.innerHTML = '<div class="empty">No exam settings yet. <a href="/onboarding/exam-dates/">Add exam dates</a>.</div>';
                    return;
                }
                list.innerHTML = data.settings.map(s => {
                    const examDate = (s.exam_dates && s.exam_dates[0]) ? s.exam_dates[0].exam_date : (s.exam_date || '');
                    return `<div class="settings-row" data-subject-id="${s.subject_id}">
                        <div class="subject-name">${s.subject_name}</div>
                        <div class="form-group"><label>Exam date</label><input type="date" value="${examDate}" data-field="exam_date"></div>
                        <div class="form-group" style="max-width:100px;"><label>Target grade</label>
                            <select data-field="target_grade">${[1,2,3,4,5,6,7,8,9].map(g => `<option value="${g}" ${g==s.target_grade?'selected':''}>Grade ${g}</option>`).join('')}</select>
                        </div>
                        <button type="button" class="btn btn-primary" data-save-subject="${s.subject_id}">Save</button>
                    </div>`;
                }).join('');
                list.querySelectorAll('[data-save-subject]').forEach(btn => {
                    btn.addEventListener('click', () => saveSubject(parseInt(btn.dataset.saveSubject, 10)));
                });
            } catch (e) {
                document.getElementById('settingsList').innerHTML = '<div class="empty">Failed to load settings.</div>';
            }
        }
        async function saveSubject(subjectId) {
            const row = document.querySelector(`.settings-row[data-subject-id="${subjectId}"]`);
            if (!row) return;
            const examDate = row.querySelector('[data-field="exam_date"]').value;
            const targetGrade = parseInt(row.querySelector('[data-field="target_grade"]').value, 10);
            try {
                const r = await fetch(`/api/users/me/settings/${subjectId}/`, {
                    method: 'PATCH',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                    body: JSON.stringify({ exam_date: examDate, target_grade: targetGrade, exam_dates: [{ exam_date: examDate, paper_label: 'Paper 1' }] }),
                });
                const data = await r.json();
                if (r.ok) showMsg('Settings saved.');
                else showMsg(data.error || 'Save failed', true);
            } catch (e) { showMsg('Network error', true); }
        }
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/api/users/auth/logout/', { method: 'POST', credentials: 'include', headers: { 'X-CSRFToken': csrf } });
                window.location.href = '/login/';
            } catch (e) { window.location.href = '/login/'; }
        });
        loadSettings();
    </script>
</body>
</html>
