<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - 285IQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #020817; min-height: 100vh; padding: 24px; }
        .container { max-width: 640px; margin: 0 auto; background: #0f172a; border-radius: 16px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        h1 { font-size: 24px; color: #f1f5f9; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
        .back { margin-bottom: 16px; }
        .back a { color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 600; }
        .settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid #f1f5f9; }
        .settings-row:last-child { border-bottom: none; }
        .form-group { flex: 1; min-width: 120px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 2px solid #334155; border-radius: 8px; font-size: 14px; }
        .subject-name { font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
        .btn { padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #6d5dfc); color: white; }
        .btn-secondary { background: #334155; color: #cbd5e1; margin-top: 24px; }
        .btn-logout { background: rgba(239,68,68,0.16); color: #fca5a5; margin-top: 24px; }
        #message { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        #message.success { background: rgba(16,185,129,0.16); color: #6ee7b7; display: block; }
        #message.error { background: rgba(239,68,68,0.16); color: #fca5a5; display: block; }
        .empty { color: #94a3b8; padding: 24px; text-align: center; }
        .section { margin-top: 32px; padding-top: 24px; border-top: 1px solid #334155; }
        .section h2 { font-size: 18px; margin-bottom: 4px; }
        .pw-form .form-group { margin-bottom: 14px; display: block; }
        .pw-form label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .pw-form input[type=password], .pw-form input[type=text] { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
        .pw-form .hint { color: #94a3b8; font-size: 13px; margin: -4px 0 14px; }
        .pw-form .field-error { color: #fca5a5; font-size: 13px; margin-top: 6px; }
        .pw-form .show { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; margin-bottom: 14px; }
        .pw-form .show input { width: auto; }
    </style>
    <link rel="stylesheet" href="/static/learning/app_theme.css">
    <style>
        /* shared dark form controls for pages migrated from the old light theme */
        body.iq-app input, body.iq-app select, body.iq-app textarea {
            background: #111827 !important; color: #f1f5f9 !important; border: 1px solid #334155 !important;
        }
        body.iq-app input::placeholder, body.iq-app textarea::placeholder { color: #64748b !important; }
        body.iq-app input:focus, body.iq-app select:focus, body.iq-app textarea:focus {
            outline: none; border-color: #06b6d4 !important; box-shadow: 0 0 0 3px rgba(6,182,212,0.2) !important;
        }
        body.iq-app a { color: #7dd3fc; }
        body.iq-app label { color: #cbd5e1; }
    </style>
</head>
<body class="iq-app">
    <div class="back"><a href="/">← Dashboard</a></div>
    <div class="container">
        <h1>Settings</h1>
        <p class="subtitle">Manage your exam dates and target grades</p>
        <div id="message"></div>
        <div id="settingsList"><div class="empty">Loading...</div></div>
        <section class="section" aria-labelledby="pwTitle">
            <h2 id="pwTitle">Change password</h2>
            <p class="subtitle">You will stay signed in on this device. Other devices will need the new password.</p>
            <form class="pw-form" id="pwForm" novalidate>
                <div class="form-group">
                    <label for="currentPw">Current password</label>
                    <input type="password" id="currentPw" name="current_password" autocomplete="current-password" required>
                    <div class="field-error" id="err-current_password" role="alert"></div>
                </div>
                <div class="form-group">
                    <label for="newPw">New password</label>
                    <input type="password" id="newPw" name="new_password" autocomplete="new-password" required aria-describedby="pwHint">
                    <div class="field-error" id="err-new_password" role="alert"></div>
                </div>
                <p class="hint" id="pwHint">At least 8 characters. Not only numbers, not a common password, and not too like your username.</p>
                <div class="form-group">
                    <label for="newPw2">Type the new password again</label>
                    <input type="password" id="newPw2" name="new_password_confirm" autocomplete="new-password" required>
                    <div class="field-error" id="err-new_password_confirm" role="alert"></div>
                </div>
                <label class="show"><input type="checkbox" id="showPw"> Show passwords</label>
                <button type="submit" class="btn btn-primary" id="pwSubmit">Change password</button>
            </form>
        </section>
        <button type="button" class="btn btn-logout" id="logoutBtn">Log out</button>
    </div>
    <script>
        const csrf = document.cookie.match(/csrftoken=([^;]+)/) ? document.cookie.match(/csrftoken=([^;]+)/)[1] : '';
        function showMsg(text, isError) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = isError ? 'error' : 'success';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
        (function () {
            const form = document.getElementById('pwForm');
            const fields = ['current_password', 'new_password', 'new_password_confirm'];
            document.getElementById('showPw').addEventListener('change', (e) => {
                ['currentPw', 'newPw', 'newPw2'].forEach(id => { document.getElementById(id).type = e.target.checked ? 'text' : 'password'; });
            });
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                fields.forEach(f => { document.getElementById('err-' + f).textContent = ''; });
                const body = {};
                fields.forEach(f => { body[f] = form.elements[f].value; });
                if (!body.current_password || !body.new_password || !body.new_password_confirm) {
                    fields.forEach(f => { if (!body[f]) document.getElementById('err-' + f).textContent = 'This is needed.'; });
                    return;
                }
                if (body.new_password !== body.new_password_confirm) {
                    document.getElementById('err-new_password_confirm').textContent = 'The two new passwords do not match.';
                    return;
                }
                const btn = document.getElementById('pwSubmit');
                btn.disabled = true;
                try {
                    const r = await fetch('/api/users/auth/change-password/', {
                        method: 'POST', credentials: 'include',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                        body: JSON.stringify(body),
                    });
                    const data = await r.json().catch(() => ({}));
                    if (r.ok) {
                        form.reset();
                        showMsg(data.message || 'Your password has been changed.');
                    } else if (r.status === 429) {
                        showMsg('Too many attempts. Please wait a while and try again.', true);
                    } else {
                        let shown = false;
                        fields.forEach(f => {
                            if (data[f]) { document.getElementById('err-' + f).textContent = [].concat(data[f]).join(' '); shown = true; }
                        });
                        if (!shown) showMsg(data.detail || 'Could not change your password. Please try again.', true);
                    }
                } catch (err) {
                    showMsg('Could not reach the server. Check your connection.', true);
                } finally {
                    btn.disabled = false;
                }
            });
        })();
        async function loadSettings() {
            try {
                const r = await fetch('/api/users/me/settings/', { credentials: 'include' });
                const data = await r.json();
                const list = document.getElementById('settingsList');
                if (!data.settings || data.settings.length === 0) {
                    list.innerHTML = '<div class="empty">No exam settings yet. <a href="/onboarding/exam-dates/">Add exam dates</a>.</div>';
                    return;
                }
                list.innerHTML = data.settings.map(s => {
                    const examDate = (s.exam_dates && s.exam_dates[0]) ? s.exam_dates[0].exam_date : (s.exam_date || '');
                    return `<div class="settings-row" data-subject-id="${s.subject_id}">
                        <div class="subject-name">${s.subject_name}</div>
                        <div class="form-group"><label>Exam date</label><input type="date" value="${examDate}" data-field="exam_date"></div>
                        <div class="form-group" style="max-width:100px;"><label>Target grade</label>
                            <select data-field="target_grade">${[1,2,3,4,5,6,7,8,9].map(g => `<option value="${g}" ${g==s.target_grade?'selected':''}>Grade ${g}</option>`).join('')}</select>
                        </div>
                        <button type="button" class="btn btn-primary" data-save-subject="${s.subject_id}">Save</button>
                    </div>`;
                }).join('');
                list.querySelectorAll('[data-save-subject]').forEach(btn => {
                    btn.addEventListener('click', () => saveSubject(parseInt(btn.dataset.saveSubject, 10)));
                });
            } catch (e) {
                document.getElementById('settingsList').innerHTML = '<div class="empty">Failed to load settings.</div>';
            }
        }
        async function saveSubject(subjectId) {
            const row = document.querySelector(`.settings-row[data-subject-id="${subjectId}"]`);
            if (!row) return;
            const examDate = row.querySelector('[data-field="exam_date"]').value;
            const targetGrade = parseInt(row.querySelector('[data-field="target_grade"]').value, 10);
            try {
                const r = await fetch(`/api/users/me/settings/${subjectId}/`, {
                    method: 'PATCH',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                    body: JSON.stringify({ exam_date: examDate, target_grade: targetGrade, exam_dates: [{ exam_date: examDate, paper_label: 'Paper 1' }] }),
                });
                const data = await r.json();
                if (r.ok) showMsg('Settings saved.');
                else showMsg(data.error || 'Save failed', true);
            } catch (e) { showMsg('Network error', true); }
        }
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/api/users/auth/logout/', { method: 'POST', credentials: 'include', headers: { 'X-CSRFToken': csrf } });
                window.location.href = '/login/';
            } catch (e) { window.location.href = '/login/'; }
        });
        loadSettings();
    </script>
</body>
</html>
