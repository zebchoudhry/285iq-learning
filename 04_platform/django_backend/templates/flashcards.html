<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - 285IQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 24px;
            color: #1e293b;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .back-link {
            display: inline-block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .back-link:hover { color: white; text-decoration: underline; }
        h1 { color: white; font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.8); margin-bottom: 24px; }
        .decks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .deck-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .deck-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .deck-name { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .deck-meta { font-size: 13px; color: #64748b; }
        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            color: #64748b;
        }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        .flashcard-view { display: none; }
        .flashcard-view.active { display: block; }
        .flashcard-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            color: white;
        }
        .flashcard-nav span { font-size: 14px; font-weight: 600; }
        .flashcard-nav button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .flashcard-nav button:hover { background: rgba(255,255,255,0.3); }
        .flashcard-nav button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .flashcard-container {
            perspective: 1200px;
            margin-bottom: 24px;
        }
        /* Inner wrapper keeps a stable height; faces are stacked in 3D (both absolute). */
        .flashcard {
            position: relative;
            min-height: 220px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-front,
        .flashcard-back {
            position: absolute;
            inset: 0;
            padding: 32px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            /* Nudge onto own layer so hidden backfaces don’t bleed through (Chrome/Edge). */
            transform-style: preserve-3d;
        }
        .flashcard-front {
            transform: rotateY(0deg) translateZ(1px);
        }
        .flashcard-back {
            transform: rotateY(180deg) translateZ(1px);
        }
        .flashcard-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
        }
        .flashcard-text { font-size: 18px; line-height: 1.6; color: #1e293b; }
        .flip-hint { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Flashcards</h1>
        <p class="subtitle">Review key concepts by topic</p>

        <div id="decksView" class="decks-view">
            <div id="decksList" class="decks-grid"></div>
            <div id="decksEmpty" class="empty-state" style="display:none;">
                <div class="empty-state-icon">🃏</div>
                <p style="font-size:16px;font-weight:600;color:#1e293b;margin-bottom:8px;">No flashcard decks yet</p>
                <p>Run the generate_flashcards management command to create flashcards from your content.</p>
            </div>
        </div>

        <div id="flashcardView" class="flashcard-view">
            <div class="flashcard-nav">
                <button type="button" id="backToDecks">← Back to decks</button>
                <span id="cardCounter">1 / 1</span>
                <div>
                    <button type="button" id="prevCard">← Prev</button>
                    <button type="button" id="nextCard">Next →</button>
                </div>
            </div>
            <div class="flashcard-container">
                <div id="flashcard" class="flashcard">
                    <div class="flashcard-front">
                        <div class="flashcard-label">Front</div>
                        <div id="frontText" class="flashcard-text"></div>
                    </div>
                    <div class="flashcard-back">
                        <div class="flashcard-label">Back</div>
                        <div id="backText" class="flashcard-text"></div>
                    </div>
                </div>
            </div>
            <p class="flip-hint">Click the card to flip</p>
        </div>
    </div>

    <script>
        let decks = [];
        let currentDeck = null;
        let currentIndex = 0;
        const urlParams = new URLSearchParams(window.location.search);
        const topicIdParam = urlParams.get('topic_id');

        async function loadDecks() {
            try {
                const r = await fetch('/api/flashcards/decks/', { credentials: 'include' });
                if (r.status === 401 || r.status === 403) {
                    window.location.href = '/login/';
                    return;
                }
                decks = await r.json();
                renderDecks();
                if (topicIdParam && decks.some(d => d.id == topicIdParam)) {
                    openDeck(parseInt(topicIdParam, 10));
                }
            } catch (e) {
                console.error('Failed to load decks', e);
                document.getElementById('decksEmpty').style.display = 'block';
            }
        }

        function renderDecks() {
            const list = document.getElementById('decksList');
            const empty = document.getElementById('decksEmpty');
            if (decks.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            list.innerHTML = decks.map(d => `
                <div class="deck-card" data-topic-id="${d.id}">
                    <div class="deck-name">${escapeHtml(d.name)}</div>
                    <div class="deck-meta">${d.subject_name} · ${d.card_count} cards</div>
                </div>
            `).join('');
            list.querySelectorAll('.deck-card').forEach(el => {
                el.addEventListener('click', () => openDeck(parseInt(el.dataset.topicId, 10)));
            });
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        async function openDeck(topicId) {
            try {
                const r = await fetch(`/api/flashcards/topic/${topicId}/`, { credentials: 'include' });
                if (!r.ok) return;
                currentDeck = await r.json();
                currentIndex = 0;
                document.getElementById('decksView').classList.remove('active');
                document.getElementById('decksView').style.display = 'none';
                document.getElementById('flashcardView').classList.add('active');
                document.getElementById('flashcardView').style.display = 'block';
                showCard();
            } catch (e) {
                console.error('Failed to load deck', e);
            }
        }

        function showCard() {
            const cards = currentDeck.flashcards || [];
            if (cards.length === 0) {
                document.getElementById('frontText').textContent = 'No cards in this deck.';
                document.getElementById('backText').textContent = '';
                document.getElementById('cardCounter').textContent = '0 / 0';
                return;
            }
            const card = cards[currentIndex];
            document.getElementById('frontText').textContent = card.front || '';
            document.getElementById('backText').textContent = card.back || '';
            document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${cards.length}`;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('prevCard').disabled = currentIndex === 0;
            document.getElementById('nextCard').disabled = currentIndex === cards.length - 1;
        }

        document.getElementById('flashcard').addEventListener('click', () => {
            document.getElementById('flashcard').classList.toggle('flipped');
        });

        document.getElementById('prevCard').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                showCard();
            }
        });

        document.getElementById('nextCard').addEventListener('click', () => {
            const cards = currentDeck?.flashcards || [];
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                showCard();
            }
        });

        document.getElementById('backToDecks').addEventListener('click', () => {
            document.getElementById('flashcardView').classList.remove('active');
            document.getElementById('flashcardView').style.display = 'none';
            document.getElementById('decksView').style.display = 'block';
        });

        loadDecks();
    </script>
</body>
</html>
