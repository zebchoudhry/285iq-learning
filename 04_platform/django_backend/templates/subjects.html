<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subjects - 285IQ</title>
    <link rel="stylesheet" href="/static/learning/app_theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #020817; min-height: 100vh; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; }
        .back { margin-bottom: 16px; }
        .back a { color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 600; }
        h1 { color: white; font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.85); margin-bottom: 24px; font-size: 14px; }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .subject-card { background: #0f172a; border-radius: 12px; padding: 28px 22px; text-align: center; cursor: pointer; transition: all .3s; border: 1px solid #334155; text-decoration: none; display: block; color: inherit; }
        .subject-card:hover { transform: translateY(-4px); box-shadow: 0 0 24px rgba(6,182,212,0.18); border-color: #06b6d4; }
        .subject-icon { font-size: 48px; margin-bottom: 16px; }
        .subject-name { font-size: 20px; font-weight: 800; color: #f1f5f9; margin-bottom: 8px; }
        .subject-progress { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
        .progress-bar-container { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #06b6d4, #3b82f6); border-radius: 4px; transition: width .3s; }
        .empty { text-align: center; color: rgba(255,255,255,0.9); padding: 48px 24px; }
    </style>
</head>
<body class="iq-app">
    <div class="container">
        <div class="back"><a href="/">← Dashboard</a></div>
        <h1>My Subjects</h1>
        <p class="subtitle">Click a subject to view topics and lessons</p>
        <div class="subjects-grid" id="subjects-grid">
            <div class="empty">Loading...</div>
        </div>
    </div>
    <script>
        const icons = { 'mathematics':'📐','biology':'🧬','chemistry':'⚗️','physics':'⚛️' };
        async function loadSubjects() {
            try {
                const [subjRes, progressRes] = await Promise.all([
                    fetch('/api/subjects/', { credentials: 'include' }),
                    fetch('/api/subject-progress/', { credentials: 'include' })
                ]);
                const progressList = progressRes.ok ? await progressRes.json() : [];
                const progressBySubject = {};
                progressList.forEach(p => { progressBySubject[p.subject_id] = p; });
                const data = subjRes.ok ? await subjRes.json() : {};
                const subjects = data.results || data;
                const arr = Array.isArray(subjects) ? subjects : [];
                const map = new Map();
                for (const s of arr) { if (s && s.name) map.set(s.name, s); }
                const desired = ['mathematics','biology','chemistry','physics'];
                const mainSubjects = desired.filter(k => map.has(k)).map(k => map.get(k));
                const grid = document.getElementById('subjects-grid');
                if (mainSubjects.length === 0) {
                    grid.innerHTML = '<div class="empty">No subjects available yet</div>';
                    return;
                }
                grid.innerHTML = mainSubjects.map(subject => {
                    const progress = progressBySubject[subject.id] || {};
                    const total = progress.total_lessons || 0;
                    const completed = progress.completed_lessons || 0;
                    const pct = progress.progress_percent != null ? progress.progress_percent : 0;
                    const progressText = total ? `${completed}/${total} lessons • ${pct}% complete` : 'Ready to learn';
                    const displayName = (subject.display_name || '').replace(/^(?:GCSE\s+|GSCE\s+)+/gi, '').trim() || subject.name;
                    return `<a href="/subject/${subject.id}/" class="subject-card">
                        <div class="subject-icon">${icons[subject.name] || '📚'}</div>
                        <div class="subject-name">GCSE ${displayName}</div>
                        <div class="subject-progress">${progressText}</div>
                        <div class="progress-bar-container"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                    </a>`;
                }).join('');
            } catch (e) {
                document.getElementById('subjects-grid').innerHTML = '<div class="empty">Failed to load subjects</div>';
            }
        }
        loadSubjects();
    </script>
</body>
</html>
