<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - 285IQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#020817;--surface:#0f172a;--surface2:#1e293b;--border:#334155;--primary:#3b82f6;--cyan:#06b6d4;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--text:#f1f5f9;--text-muted:#64748b;--accent:#06b6d4;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Exo 2',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px;}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(6,182,212,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0;}
        .wrap{position:relative;z-index:1;width:100%;max-width:640px;}
        .back{margin-bottom:20px;} .back a{color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:600;} .back a:hover{color:var(--text);}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;}
        .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--accent);border:1px solid var(--border);margin-bottom:14px;}
        .timer{font-size:13px;color:var(--text-muted);margin-bottom:10px;}
        .progress{font-size:13px;color:var(--text-muted);margin-bottom:16px;}
        .question{font-size:17px;font-weight:600;color:var(--text);line-height:1.6;margin-bottom:22px;}
        .options{display:flex;flex-direction:column;gap:10px;}
        .option{padding:13px 16px;border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text);background:var(--surface2);transition:border-color .2s;}
        .option:hover{border-color:var(--accent);}
        .option.selected{border-color:var(--primary);background:rgba(59,130,246,.1);}
        .option.correct{border-color:var(--success);background:rgba(16,185,129,.12);}
        .option.incorrect{border-color:var(--danger);background:rgba(239,68,68,.1);}
        input[type=text]{width:100%;padding:13px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);font-family:inherit;}
        input[type=text]:focus{outline:none;border-color:var(--accent);}
        input[type=number]{width:100%;padding:11px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);font-family:inherit;}
        input[type=number]:focus{outline:none;border-color:var(--accent);}
        .feedback{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:14px;}
        .feedback.correct{background:rgba(16,185,129,.15);border:1px solid var(--success);color:var(--success);}
        .feedback.incorrect{background:rgba(239,68,68,.1);border:1px solid var(--danger);color:#fca5a5;}
        .feedback .expl{margin-top:8px;color:var(--text-muted);font-size:13px;}
        .btn{margin-top:18px;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:opacity .2s;} .btn:hover{opacity:.85;}
        .btn-primary{background:var(--primary);color:#fff;}
        .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
        .btn:disabled{opacity:.5;cursor:not-allowed;}
        .error-msg{background:rgba(239,68,68,.12);border:1px solid var(--danger);color:#fca5a5;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;}
        .form-group{margin-bottom:14px;} .form-group label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="back"><a href="/">← Dashboard</a></div>

    <div class="card" id="start-screen">
        <h1 style="font-size:20px;font-weight:800;margin-bottom:18px;">Start Quiz</h1>
        <a href="/quiz/?mode=quick_fire" class="btn btn-primary" style="display:inline-block;text-decoration:none;margin-bottom:16px;">⚡ Quick Quiz (5–10 questions)</a>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:18px;">Or enter a topic ID to practice a specific topic.</p>
        <form id="start-form">
            <div class="form-group"><label>Topic ID</label><input type="number" id="topic-id" min="1" placeholder="e.g. 1"></div>
            <button type="submit" class="btn btn-ghost">Start Topic Quiz</button>
        </form>
        <div id="start-error" class="error-msg" style="display:none;margin-top:12px;"></div>
    </div>

    <div class="card" id="quiz-screen" style="display:none;">
        <div class="badge" id="mode-badge"></div>
        <div class="timer" id="timer">Time: 0s</div>
        <div class="progress" id="progress-text"></div>
        <div class="question" id="question-text"></div>
        <div id="answer-area"></div>
        <div id="feedback-area"></div>
        <button class="btn btn-primary" id="submit-btn" style="display:none;">Submit</button>
        <button class="btn btn-ghost" id="next-btn" style="display:none;">Next question →</button>
    </div>
</div>
<script>
    const urlParams=new URLSearchParams(location.search);
    const topicIdParam=urlParams.get('topic_id'), modeParam=urlParams.get('mode');
    let state={topicId:null,questionIds:[],currentIndex:0,currentQuestion:null,mode:null,startTime:null,firstActionTime:null,timerInterval:null};

    function getCookie(n){const c=document.cookie.match(new RegExp(n+'=([^;]+)'));return c?c[1]:'';}

    async function startQuiz(topicId){
        try{
            const body=topicId?{topic_id:topicId}:{mode:'quick_fire'};
            const r=await fetch('/api/quiz/start/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},credentials:'include',body:JSON.stringify(body)});
            const data=await r.json();
            if(!r.ok){showError(data.error||'Failed to start quiz');return;}
            state.questionIds=data.question_ids||[];
            state.mode=data.mode||'';
            state.currentIndex=0;
            document.getElementById('mode-badge').textContent='Mode: '+(state.mode||'quiz');
            document.getElementById('start-screen').style.display='none';
            document.getElementById('quiz-screen').style.display='block';
            if(data.question){state.currentQuestion=data.question;renderQuestion(data.question);updateProgress();}
            else if(state.questionIds.length){await loadQuestion(state.questionIds[0]);}
            else{document.getElementById('question-text').textContent='No questions available for this topic yet.';}
            state.timerInterval=setInterval(updateTimer,1000);
        }catch(e){showError('Network error. Try again.');}
    }

    async function loadQuestion(id){
        const r=await fetch('/api/quiz/question/'+id+'/',{credentials:'include'});
        const q=await r.json();
        if(r.ok){state.currentQuestion=q;renderQuestion(q);}
    }

    function renderQuestion(q){
        document.getElementById('question-text').textContent=q.question_text;
        const area=document.getElementById('answer-area');
        document.getElementById('feedback-area').innerHTML='';
        document.getElementById('submit-btn').style.display='inline-block';
        document.getElementById('submit-btn').disabled=false;
        document.getElementById('next-btn').style.display='none';
        if(q.question_type==='multiple_choice'&&q.options?.length){
            area.innerHTML='<div class="options">'+q.options.map(o=>`<div class="option" data-option-id="${o.id}">${o.option_text}</div>`).join('')+'</div>';
            area.querySelectorAll('.option').forEach(el=>el.addEventListener('click',()=>{
                area.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
                el.classList.add('selected');
                if(!state.firstActionTime)state.firstActionTime=Date.now();
            }));
        }else{
            area.innerHTML='<input type="text" id="short-answer" placeholder="Your answer">';
            const inp=document.getElementById('short-answer');
            inp.focus();
            inp.addEventListener('input',()=>{if(!state.firstActionTime)state.firstActionTime=Date.now();});
        }
        state.startTime=Date.now();
    }

    function updateTimer(){if(!state.startTime)return;const e=Math.floor((Date.now()-state.startTime)/1000);document.getElementById('timer').textContent='Time: '+e+'s';}
    function updateProgress(){if(state.questionIds.length)document.getElementById('progress-text').textContent=`Question ${state.currentIndex+1} of ${state.questionIds.length}`;}

    function getAnswer(){
        const sel=document.querySelector('.option.selected');
        if(sel)return{selected_option_id:parseInt(sel.dataset.optionId,10)};
        const inp=document.getElementById('short-answer');
        if(inp)return{answer:inp.value.trim()};
        return{};
    }

    async function submitAnswer(){
        const q=state.currentQuestion;if(!q)return;
        const payload={question_id:q.id,time_spent_ms:Math.round(Date.now()-state.startTime),time_to_first_action_ms:state.firstActionTime?Math.round(state.firstActionTime-state.startTime):null,...getAnswer()};
        document.getElementById('submit-btn').disabled=true;
        const r=await fetch('/api/attempts/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},credentials:'include',body:JSON.stringify(payload)});
        const data=await r.json();
        const correct=r.ok&&data.is_correct;
        const fb=document.getElementById('feedback-area');
        fb.className='feedback '+(correct?'correct':'incorrect');
        fb.innerHTML=(correct?'✓ Correct!':'✗ Incorrect.')+(data.explanation?`<div class="expl">${data.explanation}</div>`:'');
        document.getElementById('submit-btn').style.display='none';
        document.getElementById('next-btn').style.display='inline-block';
    }

    function nextQuestion(){
        state.currentIndex++;state.firstActionTime=null;
        if(state.currentIndex<state.questionIds.length){
            updateProgress();
            loadQuestion(state.questionIds[state.currentIndex]);
        }else{
            document.getElementById('question-text').textContent='Quiz complete! Well done.';
            document.getElementById('answer-area').innerHTML='';
            document.getElementById('feedback-area').innerHTML='';
            document.getElementById('next-btn').style.display='none';
            if(state.timerInterval)clearInterval(state.timerInterval);
        }
    }

    function showError(msg){const el=document.getElementById('start-error');el.textContent=msg;el.style.display='block';}
    document.getElementById('start-form').addEventListener('submit',e=>{e.preventDefault();const id=parseInt(document.getElementById('topic-id').value,10);if(id&&!isNaN(id))startQuiz(id);else showError('Enter a valid topic ID');});
    document.getElementById('submit-btn').addEventListener('click',submitAnswer);
    document.getElementById('next-btn').addEventListener('click',nextQuestion);

    if(modeParam==='quick_fire')startQuiz(null);
    else if(topicIdParam){document.getElementById('topic-id').value=topicIdParam;startQuiz(parseInt(topicIdParam,10));}
</script>
</body>
</html>
