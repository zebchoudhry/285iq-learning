<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - 285IQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .back { margin-bottom: 20px; }
        .back a { color: #667eea; text-decoration: none; font-weight: 600; }
        .mode-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: #ede9fe;
            color: #6d28d9;
            margin-bottom: 16px;
        }
        .timer {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover { border-color: #667eea; background: #f8fafc; }
        .option.selected { border-color: #667eea; background: #ede9fe; }
        .option.correct { border-color: #10b981; background: #d1fae5; }
        .option.incorrect { border-color: #ef4444; background: #fee2e2; }
        .short-answer-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        .short-answer-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
        }
        .feedback.correct { background: #d1fae5; color: #065f46; }
        .feedback.incorrect { background: #fee2e2; color: #991b1b; }
        .feedback .explanation { margin-top: 8px; color: #475569; }
        .btn {
            margin-top: 24px;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .progress-text { font-size: 13px; color: #64748b; margin-bottom: 12px; }
        .start-form label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; }
        .start-form input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back"><a href="/">← Back to Dashboard</a></div>

        <div id="start-screen">
            <h1 style="margin-bottom: 16px;">Start Quiz</h1>
            <div style="margin-bottom: 20px;">
                <a href="/quiz/?mode=quick_fire" class="btn" style="display: inline-block; text-decoration: none; margin-bottom: 12px;">Quick Quiz (5–10 questions)</a>
            </div>
            <p style="color: #64748b; margin-bottom: 20px;">Or enter a topic ID to practice a specific topic.</p>
            <form id="start-form" class="start-form">
                <label for="topic-id">Topic ID</label>
                <input type="number" id="topic-id" name="topic_id" min="1" placeholder="e.g. 1">
                <button type="submit" class="btn btn-secondary">Start Topic Quiz</button>
            </form>
            <div id="start-error" class="error-msg" style="display: none;"></div>
        </div>

        <div id="quiz-screen" style="display: none;">
            <div class="mode-badge" id="mode-badge"></div>
            <div class="timer" id="timer">Time: 0s</div>
            <div class="progress-text" id="progress-text"></div>
            <div class="question-text" id="question-text"></div>
            <div id="answer-area"></div>
            <div id="feedback-area"></div>
            <button type="button" class="btn" id="submit-btn" style="display: none;">Submit</button>
            <button type="button" class="btn btn-secondary" id="next-btn" style="display: none;">Next question</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const topicIdParam = urlParams.get('topic_id');
        const modeParam = urlParams.get('mode');

        let state = {
            topicId: topicIdParam ? parseInt(topicIdParam, 10) : null,
            questionIds: [],
            currentIndex: 0,
            currentQuestion: null,
            mode: null,
            startTime: null,
            firstActionTime: null,
        };

        function getCookie(name) {
            const c = document.cookie.split(';');
            for (let i = 0; i < c.length; i++) {
                const x = c[i].trim();
                if (x.startsWith(name + '=')) return decodeURIComponent(x.slice(name.length + 1));
            }
            return null;
        }

        function showStart() {
            document.getElementById('start-screen').style.display = 'block';
            document.getElementById('quiz-screen').style.display = 'none';
        }

        function showQuiz() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
        }

        function renderQuestion(q) {
            document.getElementById('question-text').textContent = q.question_text;
            const area = document.getElementById('answer-area');
            document.getElementById('feedback-area').innerHTML = '';
            document.getElementById('submit-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';

            if (q.question_type === 'multiple_choice' && q.options && q.options.length) {
                area.innerHTML = '<div class="options">' + q.options.map(opt =>
                    `<div class="option" data-option-id="${opt.id}">${opt.option_text}</div>`
                ).join('') + '</div>';
                area.querySelectorAll('.option').forEach(el => {
                    el.addEventListener('click', () => {
                        area.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                        el.classList.add('selected');
                        if (!state.firstActionTime) state.firstActionTime = Date.now();
                    });
                });
            } else {
                area.innerHTML = '<input type="text" class="short-answer-input" id="short-answer" placeholder="Your answer">';
                const input = document.getElementById('short-answer');
                input.focus();
                input.addEventListener('input', () => { if (!state.firstActionTime) state.firstActionTime = Date.now(); });
            }
            state.startTime = Date.now();
        }

        function updateTimer() {
            if (!state.startTime) return;
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            document.getElementById('timer').textContent = 'Time: ' + elapsed + 's';
        }

        async function startQuiz(topicId) {
            try {
                const body = topicId ? { topic_id: topicId } : { mode: 'quick_fire' };
                const r = await fetch('/api/quiz/start/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    credentials: 'include',
                    body: JSON.stringify(body)
                });
                const data = await r.json();
                if (!r.ok) {
                    document.getElementById('start-error').textContent = data.error || 'Failed to start quiz';
                    document.getElementById('start-error').style.display = 'block';
                    return;
                }
                state.topicId = topicId;
                state.questionIds = data.question_ids || [];
                state.mode = data.mode || '';
                state.currentIndex = 0;
                document.getElementById('mode-badge').textContent = 'Mode: ' + (state.mode || 'quiz');
                showQuiz();
                if (data.question) {
                    state.currentQuestion = data.question;
                    renderQuestion(data.question);
                    document.getElementById('progress-text').textContent =
                        state.questionIds.length ? `Question ${state.currentIndex + 1} of ${state.questionIds.length}` : '';
                } else if (state.questionIds.length) {
                    await loadQuestion(state.questionIds[0]);
                } else {
                    document.getElementById('question-text').textContent = 'No questions available for this topic yet. Try another topic or complete some lessons first.';
                    document.getElementById('answer-area').innerHTML = '';
                }
                const t = setInterval(updateTimer, 1000);
                state.timerInterval = t;
            } catch (err) {
                document.getElementById('start-error').textContent = 'Network error. Try again.';
                document.getElementById('start-error').style.display = 'block';
            }
        }

        async function loadQuestion(id) {
            try {
                const r = await fetch('/api/quiz/question/' + id + '/', { credentials: 'include' });
                const q = await r.json();
                if (r.ok) {
                    state.currentQuestion = q;
                    renderQuestion(q);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function getSelectedAnswer() {
            const selected = document.querySelector('.option.selected');
            if (selected) return { selected_option_id: parseInt(selected.dataset.optionId, 10) };
            const input = document.getElementById('short-answer');
            if (input) return { answer: input.value.trim() };
            return {};
        }

        async function submitAnswer() {
            const q = state.currentQuestion;
            if (!q) return;
            const timeSpent = Math.round((Date.now() - state.startTime));
            const timeToFirst = state.firstActionTime ? Math.round(state.firstActionTime - state.startTime) : null;
            const payload = {
                question_id: q.id,
                time_spent_ms: timeSpent,
                time_to_first_action_ms: timeToFirst,
                ...getSelectedAnswer()
            };

            document.getElementById('submit-btn').disabled = true;
            try {
                const r = await fetch('/api/attempts/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await r.json();
                const correct = r.ok && data.is_correct;
                const feedback = document.getElementById('feedback-area');
                feedback.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
                feedback.innerHTML = (correct ? '✓ Correct!' : '✗ Incorrect.') +
                    (data.explanation ? '<div class="explanation">' + data.explanation + '</div>' : '');
                feedback.style.display = 'block';
                document.getElementById('submit-btn').style.display = 'none';
                document.getElementById('next-btn').style.display = 'inline-block';

                if (document.querySelector('.option.selected')) {
                    document.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'incorrect'));
                    // We don't show which option was correct to avoid leaking answer
                }
            } catch (err) {
                document.getElementById('submit-btn').disabled = false;
            }
        }

        function nextQuestion() {
            state.currentIndex++;
            state.firstActionTime = null;
            if (state.currentIndex < state.questionIds.length) {
                document.getElementById('progress-text').textContent =
                    `Question ${state.currentIndex + 1} of ${state.questionIds.length}`;
                loadQuestion(state.questionIds[state.currentIndex]);
                document.getElementById('submit-btn').style.display = 'inline-block';
                document.getElementById('submit-btn').disabled = false;
            } else {
                document.getElementById('question-text').textContent = 'Quiz complete! Well done.';
                document.getElementById('answer-area').innerHTML = '';
                document.getElementById('feedback-area').innerHTML = '';
                document.getElementById('next-btn').style.display = 'none';
                if (state.timerInterval) clearInterval(state.timerInterval);
            }
        }

        document.getElementById('start-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const topicId = parseInt(document.getElementById('topic-id').value, 10);
            if (topicId && !isNaN(topicId)) startQuiz(topicId);
            else document.getElementById('start-error').textContent = 'Enter a valid topic ID';
            document.getElementById('start-error').style.display = topicId && !isNaN(topicId) ? 'none' : 'block';
        });

        document.getElementById('submit-btn').addEventListener('click', submitAnswer);
        document.getElementById('next-btn').addEventListener('click', nextQuestion);

        if (modeParam === 'quick_fire') {
            startQuiz(null);
        } else if (topicIdParam) {
            document.getElementById('topic-id').value = topicIdParam;
            startQuiz(parseInt(topicIdParam, 10));
        }
    </script>
</body>
</html>
