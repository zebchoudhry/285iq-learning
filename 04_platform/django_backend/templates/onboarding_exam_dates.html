<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>When are your exams? - 285IQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        h1 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
        .subtitle { color: #64748b; margin-bottom: 24px; font-size: 14px; }
        .subject-block {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8fafc;
        }
        .subject-block h3 { font-size: 14px; color: #475569; margin-bottom: 12px; }
        .form-row { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: #475569; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
                            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .exam-date-row { margin-bottom: 8px; }
        .add-paper { margin-top: 8px; }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 100%;
            padding: 14px;
            margin-top: 8px;
        }
        .btn-primary:hover { opacity: 0.95; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-remove { background: #fee2e2; color: #dc2626; font-size: 12px; padding: 6px 12px; }
        #errorMessage {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        #errorMessage.show { display: block; }
        .add-subject { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>When are your exams?</h1>
        <p class="subtitle">Add each subject and the dates for Paper 1 and Paper 2 (or other papers). We'll use this to plan your revision.</p>
        <div id="errorMessage"></div>
        <div id="subjectBlocks"></div>
        <button type="button" class="btn btn-secondary add-subject" id="addSubjectBtn">+ Add another subject</button>
        <button type="button" class="btn btn-primary" id="submitBtn">Save and go to dashboard</button>
    </div>
    <script>
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken');
        let subjects = [];
        let subjectBlockIndex = 0;

        function getCookie(name) {
            let v = null;
            if (document.cookie) {
                document.cookie.split(';').forEach(c => {
                    const [k, val] = c.trim().split('=');
                    if (k === name) v = decodeURIComponent(val);
                });
            }
            return v;
        }

        async function loadSubjects() {
            const r = await fetch('/api/subjects/', { credentials: 'include' });
            if (!r.ok) return;
            const data = await r.json();
            subjects = Array.isArray(data) ? data : (data.results || []);
            if (!Array.isArray(subjects)) subjects = [];
            addSubjectBlock();
        }

        function addSubjectBlock() {
            const block = document.createElement('div');
            block.className = 'subject-block';
            block.dataset.index = subjectBlockIndex++;
            block.innerHTML = `
                <h3>Subject</h3>
                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label>Subject</label>
                        <select class="subject-select" data-subject-id>
                            <option value="">-- Choose subject --</option>
                            ${subjects.map(s => `<option value="${s.id}">${s.display_name || s.name || s.id}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group" style="max-width:120px;">
                        <label>Target grade</label>
                        <select class="target-grade">
                            ${[1,2,3,4,5,6,7,8,9].map(g => `<option value="${g}" ${g===5?'selected':''}>Grade ${g}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group" style="max-width:130px;">
                        <label>Exam board</label>
                        <select class="exam-board">
                            <option value="aqa" selected>AQA</option>
                            <option value="edexcel">Edexcel</option>
                            <option value="ocr">OCR</option>
                            <option value="wjec">WJEC</option>
                        </select>
                    </div>
                </div>
                <div class="exam-dates-container">
                    <div class="exam-date-row">
                        <div class="form-row">
                            <div class="form-group"><label>Paper 1 date</label><input type="date" class="exam-date" data-paper="Paper 1"></div>
                            <div class="form-group"><label>Paper 2 date</label><input type="date" class="exam-date" data-paper="Paper 2"></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('subjectBlocks').appendChild(block);
        }

        document.getElementById('addSubjectBtn').addEventListener('click', addSubjectBlock);

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const blocks = document.querySelectorAll('.subject-block');
            const payload = { subjects: [] };
            for (const block of blocks) {
                const sid = block.querySelector('.subject-select').value;
                if (!sid) continue;
                const targetGrade = parseInt(block.querySelector('.target-grade').value, 10);
                const dateInputs = block.querySelectorAll('.exam-date');
                const exam_dates = [];
                dateInputs.forEach(inp => {
                    if (inp.value) exam_dates.push({ exam_date: inp.value, paper_label: inp.dataset.paper || 'Paper 1' });
                });
                if (exam_dates.length === 0) continue;
                const examBoard = block.querySelector('.exam-board').value || 'aqa'; payload.subjects.push({ subject_id: parseInt(sid, 10), target_grade: targetGrade, exam_board: examBoard, exam_dates });
            }
            if (payload.subjects.length === 0) {
                document.getElementById('errorMessage').textContent = 'Add at least one subject with at least one exam date.';
                document.getElementById('errorMessage').classList.add('show');
                return;
            }
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = 'Saving...';
            try {
                const r = await fetch('/api/users/onboarding/exam-dates/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    credentials: 'include',
                    body: JSON.stringify(payload),
                });
                const data = await r.json();
                if (r.ok) {
                    window.location.href = data.redirect || '/';
                } else {
                    document.getElementById('errorMessage').textContent = data.error || JSON.stringify(data);
                    document.getElementById('errorMessage').classList.add('show');
                }
            } catch (e) {
                document.getElementById('errorMessage').textContent = 'Network error. Please try again.';
                document.getElementById('errorMessage').classList.add('show');
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'Save and go to dashboard';
            }
        });

        loadSubjects();
    </script>
</body>
</html>
