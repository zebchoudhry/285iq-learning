[pytest]
DJANGO_SETTINGS_MODULE = studymate285.settings
python_files = tests.py test_*.py *_tests.py
# Ad-hoc one-shot scripts at the repo root — not real tests, exclude from collection.
# They import packages (pdfplumber, etc.) that aren't in requirements and crash CI.
norecursedirs = backup_before_overwrite backup_before_update
addopts = -p pytest_django -p no:warnings --ignore=test_pdf.py --ignore=test_setup.py --ignore=test_summaries.py
